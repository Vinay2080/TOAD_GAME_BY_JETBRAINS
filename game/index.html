<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/tode.svg" />
    <meta name="viewport" content="width=device-width" />
    <title>Toad Hop</title>
  </head>
  <body>
    <div class="start-screen">
      <div class="start-content">
        <h1><img src="/tode.svg" class="title-tode-icon" alt="Toad"/> TOAD HOP</h1>
        <div class="instructions">
          <div class="controls-grid">
            <span class="key-label">Arrow Keys / WASD</span><span class="control-desc">Move</span>
            <span class="key-label">Spacebar</span><span class="control-desc">Attack</span>
          </div>
        </div>
        <div class="start-button">Press SPACE or Click to Start</div>
      </div>
    </div>
    <div class="score">Score: 0</div>
    <div class="pause-button-ui">⏸</div>
    <div class="health-bar"></div>
    <div class="inspect-mode" style="display: none;">🔍 INSPECT MODE - WASD/Arrows: Move Camera | I: Toggle</div>
    <div class="pause-menu" style="display: none;">
      <div class="pause-content">
        <h1>Paused</h1>
        <p>Press ESC or click to resume.</p>
      </div>
    </div>
    <div class="game-over" style="display: none;"></div>
    <canvas class="game"></canvas>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
